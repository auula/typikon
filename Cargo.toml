[package]
name = "typikon"
version = "0.1.5"
edition = "2021"
rust-version = "1.79"
license = "Apache-2.0"
authors = ["Leon Ding <ding@ibyte.me>"]
description = "Typikon lets you use markdown to write your online books."
repository = "https://github.com/auula/typikon"


[dependencies]
pulldown-cmark = { version = "0.10.0", default-features = false, features = ["html"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"
colored = "2.0"
chrono = "0.4"
tera = "1.11"
walkdir = "2.3"
reqwest = { version = "0.11", features = ["blocking"] }
zip = "0.6"
warp = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync"] }
serde_json = "1.0"
notify = "6.1.1"
notify-debouncer-mini = "0.4.1"

[dev-dependencies]
tempfile = "3.10"

[package.metadata]
description = "Typikon lets you use markdown to write your online books."
repository = "https://github.com/auula/typikon"
